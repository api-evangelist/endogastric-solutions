name: Endogastric Solutions
description: >-
  EndoGastric Solutions is a medical device company focused on treating
  gastroesophageal reflux disease (GERD). Its flagship offering is the TIF
  (Transoral Incisionless Fundoplication) 2.0 procedure, performed with the
  EsophyX Z+ device and SerosaFuse non-resorbable polypropylene fasteners to
  endoscopically reconstruct the natural antireflux barrier at the
  esophagogastric junction, plus the combined cTIF procedure that pairs
  hiatal hernia repair with TIF. The company sells devices and clinician
  training rather than software, and it has since been acquired by Merit
  Medical — the endogastricsolutions.com domain now redirects to
  merit.com/solutions/tif-2-0/. It surfaced in the API Evangelist network as a
  portfolio company of Canaan Partners and carries no public API, developer
  portal, SDK, or technical integration surface.
